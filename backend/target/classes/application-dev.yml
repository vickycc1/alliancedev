server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://106.14.240.103:3306/tech_community?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf-8
    username: root
    password: ${DB_PASSWORD:YourSecurePassword123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: TechCommunityHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000

  data:
    redis:
      host: 106.14.240.103
      port: 6379
      password: ${REDIS_PASSWORD:YourStrongPassword123!}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

cas:
  enabled: false

ai:
  enabled: false

logging:
  level:
    com.techcommunity: debug
    org.springframework.web: debug
